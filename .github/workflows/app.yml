name: app

# Tests and the type check run on every push and PR. A manual run, or a tag vX.Y.Z,
# also builds the Android APK and AAB, attaches them to a private GitHub Release and,
# when the hub token is set, publishes the APK to velosolabs.com/ashnote/download.
# Built files are never committed.
#
# Secrets: ASHNOTE_KEYSTORE_BASE64, ASHNOTE_KEYSTORE_PASSWORD, ASHNOTE_KEY_ALIAS,
# ASHNOTE_KEY_PASSWORD (upload key; without them the build is debug-signed and marked as a
# test build). Publishing needs no secret: the store accepts this workflow's GitHub OIDC token.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write   # the store accepts this workflow's OIDC token to set release notes (scripts/store-notes.sh)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Signing config
        id: sign
        env:
          KS: ${{ secrets.ASHNOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.keystore
            node scripts/android-signing.js
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK and AAB
        working-directory: android
        env:
          # read by the signing config written by scripts/android-signing.js (unused when unsigned)
          ASHNOTE_STORE_FILE: release.keystore
          ASHNOTE_STORE_PASSWORD: ${{ secrets.ASHNOTE_KEYSTORE_PASSWORD }}
          ASHNOTE_KEY_ALIAS: ${{ secrets.ASHNOTE_KEY_ALIAS }}
          ASHNOTE_KEY_PASSWORD: ${{ secrets.ASHNOTE_KEY_PASSWORD }}
        # The APK people download is built for phone processors only (32- and 64-bit ARM), which
        # keeps it under the 100 MB upload limit in front of velosolabs.com; the x86 builds only run
        # on emulators. The AAB keeps every processor type: Google Play splits it per device.
        # The AAB (for the app stores) is built first, with no tip link. The APK (our own download)
        # is then built with EXPO_PUBLIC_DIST=apk, which shows "Support Ashnote" in Settings; app
        # stores don't allow links to outside payments. Its JS bundle is made again for that.
        run: |
          ./gradlew --no-daemon bundleRelease
          rm -rf app/build/generated/assets/react app/build/generated/res/react
          EXPO_PUBLIC_DIST=apk ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Check the tip link is only in the APK
        run: |
          has() { unzip -p "$1" '*index.android.bundle' | grep -a -c "ashnote/support" || true; }
          APK=$(has android/app/build/outputs/apk/release/app-release.apk)
          AAB=$(has android/app/build/outputs/bundle/release/app-release.aab)
          echo "tip link: apk=$APK aab=$AAB"
          if [ "$APK" = "0" ]; then echo "::error::The APK is missing the Support Ashnote link"; exit 1; fi
          if [ "$AAB" != "0" ]; then echo "::error::The store AAB must not link to outside payments"; exit 1; fi
      - name: Collect files
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          # Release notes for every version (owner's rule, 2026-11-26): one plain sentence at least.
          if [ ! -s "release-notes/$VERSION.md" ]; then echo "::error::Add release-notes/$VERSION.md before releasing $VERSION"; exit 1; fi
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ashnote-$VERSION.apk"
          SIZE=$(stat -c %s "dist/ashnote-$VERSION.apk")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt 99000000 ]; then echo "::error::The APK is over the 100 MB upload limit for velosolabs.com"; exit 1; fi
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/ashnote-$VERSION.aab"
          (cd dist && sha256sum * > SHA256SUMS)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ashnote-android
          path: dist/
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="Ashnote $VERSION for Android. $(cat "release-notes/$VERSION.md")"
          if [ "${{ steps.sign.outputs.signed }}" != "true" ]; then
            TAG="v$VERSION-test-${GITHUB_RUN_NUMBER}"
            NOTES="Test build (debug-signed, not for the stores or the public download)."
          fi
          gh release create "$TAG" dist/* --title "Ashnote $TAG" --notes "$NOTES" \
            $([ "${{ steps.sign.outputs.signed }}" != "true" ] && echo --prerelease) || \
          gh release upload "$TAG" dist/* --clobber
      - name: Publish the APK on velosolabs.com
        if: steps.sign.outputs.signed == 'true'
        # Uploads to the VelosoLabs store as a production release, signed in with this workflow's own
        # GitHub OIDC token (accepted for s2925534/ashnote on main or a tag; no stored secret). The store
        # serves /ashnote/download, the download page and apps.velosolabs.com/ashnote from this release.
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://velosolabs.com" | jq -r .value)
          curl -fsS -X POST "https://velosolabs.com/api/v1/admin/store/ashnote/releases" \
            -H "Authorization: Bearer $TOKEN" \
            --form-string "track=production" --form-string "changelog=$(cat "release-notes/$VERSION.md")" \
            -F "file=@dist/ashnote-$VERSION.apk"

      - name: Release notes on the VelosoLabs store
        if: steps.sign.outputs.signed == 'true'
        # fills any empty store notes (this release, and older ones) from release-notes/; never fails the release
        run: bash scripts/store-notes.sh || echo "::warning::could not set the store release notes"
