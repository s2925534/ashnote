name: store-notes
# Fills in empty release notes on the VelosoLabs store from release-notes/<version>.md.
# The release workflow (app.yml) does the same after each upload; run this by hand to backfill.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  notes:
    # NAS self-hosted runners when CI_RUNNER == 'nas' (VDEV-33); GitHub-hosted otherwise.
    runs-on: ${{ vars.CI_RUNNER == 'nas' && fromJSON('["self-hosted","nas"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/store-notes.sh
