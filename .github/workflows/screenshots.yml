name: screenshots

# Documentation screenshots of the real Android app (VLABS-409). Manual only.
# Builds a screenshot-only APK (EXPO_PUBLIC_SCREENSHOT_MODE=1 lets the emulator capture the
# screens, which release builds block, and it may talk to the local relay over ws://; it is
# debug-signed and never published), runs it on an
# emulator against a local relay with a scripted second phone (scripts/shots/peer.ts), and
# pushes the PNGs to a short-lived branch "shots/<run id>" for the docs to pick up.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    # Stays GitHub-hosted: builds the native Android app (expo prebuild + gradle)
    # and runs it on an Android emulator (needs the Android SDK and KVM/nested
    # virtualisation). The NAS self-hosted runner image has neither (VDEV-33).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Remove screenshot branches from earlier runs
        run: |
          for b in $(git ls-remote --heads origin 'shots/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            git push -q origin --delete "$b" && echo "deleted $b"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Allow the local test relay (ws://localhost, screenshot build only)
        run: sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml && grep -c usesCleartextTraffic android/app/src/main/AndroidManifest.xml
      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Build the screenshot APK (x86_64, debug-signed)
        working-directory: android
        env:
          EXPO_PUBLIC_SCREENSHOT_MODE: "1"
          EXPO_PUBLIC_RELAYS: ws://localhost:7777
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take the screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/shots/run.sh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashnote-screenshots
          path: shots/
      - name: Push the screenshots to a branch
        if: always()
        run: |
          git config user.name "Pedro Veloso"
          git config user.email "pedro@veloso.dev"
          git checkout --orphan "shots/${GITHUB_RUN_ID}"
          git rm -rq --cached .
          ls shots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          git add -f shots/*.png
          git commit -qm "Android screenshots from run ${GITHUB_RUN_ID}"
          git push -q origin "shots/${GITHUB_RUN_ID}"
          echo "Pushed shots/${GITHUB_RUN_ID}"
