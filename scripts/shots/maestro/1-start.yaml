appId: com.velosolabs.ashnote
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      # the app lock asks for the PIN set in 0-lock
      - runFlow:
          when:
            visible: "Enter your PIN"
          commands:
            - tapOn: "2"
            - tapOn: "4"
            - tapOn: "6"
            - tapOn: "8"
      - extendedWaitUntil:
          visible: "Show invite code"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: shots/android-home-empty
- tapOn: "Show invite code"
- extendedWaitUntil:
    visible: "Invite code"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: shots/android-invite
